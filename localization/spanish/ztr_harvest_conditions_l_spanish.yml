 ### Global Warming - climate harvest conditions ###

 ztr_extreme_heatwave: "Extreme Heatwave"
 ztr_extreme_heatwave_desc: "Weeks of unbroken heat well beyond anything in the local record. Fields wither, livestock dies in the open, and the cities suffer worst of all: brick and asphalt hold the heat through the night, and the death toll climbs among the old and the poor."
 ztr_megadrought: "Megadrought"
 ztr_megadrought_desc: "Not a dry season but a dry decade. Reservoirs fall below their outlets, wells are deepened and deepened again, and the irrigation works built for a wetter climate now carry water that is no longer there. Herds are sold off early because there is nothing left to graze."
 ztr_hurricane: "Hurricane"
 ztr_hurricane_desc: "A tropical cyclone driven ashore by a warmer ocean. It arrives in days and leaves in weeks, but takes the harbour works, the rail embankments and the coastal towns with it. Warmer seas make landfalls both more frequent and more violent."
 ztr_extreme_wildfire: "Megafire"
 ztr_extreme_wildfire_desc: "A fire too large to fight, only to flee. Drought-cured timber and a heat-driven wind carry the front faster than firebreaks can be cut, and the smoke closes roads and lungs for hundreds of miles beyond the burn."
 ztr_coastal_flooding: "Coastal Inundation"

