# Generated by scripts/ztr_sync_localization.py; edit the English source.
 ig_trait_ztrpol_social_partnership:0 "Social Partnership"
 ig_trait_ztrpol_social_partnership_desc:0 "Unions and employers sit at the same table: wages are bargained, not fought over, and the factories keep running."
 ig_trait_ztrpol_universal_welfare:0 "Universal Welfare"
 ig_trait_ztrpol_universal_welfare_desc:0 "Healthcare, pensions and housing for all, paid for by all. The welfare state is the movement's proudest achievement."
 ig_trait_ztrpol_shock_brigades:0 "Shock Brigades"
 ig_trait_ztrpol_shock_brigades_desc:0 "Volunteer brigades of workers race to overfulfil the plan, raising dams, plants and housing blocks in record time."
 ig_trait_ztrpol_lay_schooling:0 "Lay Schooling"
 ig_trait_ztrpol_lay_schooling_desc:0 "Free, secular schooling for every child is the surest path to an enlightened and modern citizenry."
 ig_trait_ztrpol_cooperative_credit:0 "Cooperative Credit"
 ig_trait_ztrpol_cooperative_credit_desc:0 "Farmers pool their savings, machinery and harvests, borrowing from their own cooperative banks rather than from the cities."
 ig_trait_ztrpol_farmer_blockades:0 "Farmer Blockades"
 ig_trait_ztrpol_farmer_blockades_desc:0 "Tractors block the highways and manure piles up outside the ministries. The countryside will not be ignored."
 ig_trait_ztrpol_state_procurement:0 "State Procurement"
 ig_trait_ztrpol_state_procurement_desc:0 "The collective farms deliver their quotas to the state at fixed prices, feeding the cities and the treasury alike."
 ig_trait_ztrpol_charitable_works:0 "Charitable Works"
 ig_trait_ztrpol_charitable_works_desc:0 "Hospitals, soup kitchens and shelters run by the faithful soften the hardships of modern life."
 ig_trait_ztrpol_confessional_democracy:0 "Confessional Democracy"
 ig_trait_ztrpol_confessional_democracy_desc:0 "Faith and the ballot box are not enemies. Religious parties bridge the divides that would otherwise tear the nation apart."
 ig_trait_ztrpol_national_crusade:0 "National Crusade"
 ig_trait_ztrpol_national_crusade_desc:0 "Altar and flag stand together. To defend the nation is to defend the faith, and the faithful answer the call."
 ig_trait_ztrpol_managerial_revolution:0 "Managerial Revolution"
 ig_trait_ztrpol_managerial_revolution_desc:0 "Professional managers, business schools and modern accounting have made our corporations leaner and more productive."
 ig_trait_ztrpol_national_champions:0 "National Champions"
 ig_trait_ztrpol_national_champions_desc:0 "A few great national firms, protected and favoured by the state, carry the country's industry and its tax base."
 ig_trait_ztrpol_anti_elite_fervor:0 "Anti-Elite Fervor"
 ig_trait_ztrpol_anti_elite_fervor_desc:0 "The establishment has betrayed the ordinary people! Every scandal and every broken promise feeds the anger of the shopkeepers."
 ig_trait_ztrpol_lean_government:0 "Lean Government"
 ig_trait_ztrpol_lean_government_desc:0 "Every penny of the taxpayer's money must be accounted for. Fewer offices, fewer forms, fewer officials."
 ig_trait_ztrpol_party_cadres:0 "Party Cadres"
 ig_trait_ztrpol_party_cadres_desc:0 "Loyal party members trained in administration staff every office, from the village soviet to the ministry."
 ig_trait_ztrpol_mass_mobilization:0 "Mass Mobilization"
 ig_trait_ztrpol_mass_mobilization_desc:0 "Rallies, youth leagues and party militias bind the masses to the regime and fill the ranks of the army."
 ig_trait_ztrpol_political_commissars:0 "Political Commissars"
 ig_trait_ztrpol_political_commissars_desc:0 "Beside every commander stands a commissar of the party, ensuring the troops never waver in their loyalty or their resolve."
 ig_trait_ztrpol_barracks_plotting:0 "Barracks Plotting"
 ig_trait_ztrpol_barracks_plotting_desc:0 "Discontented officers meet behind closed doors. Every failure of the government is another argument for the tanks to roll."
