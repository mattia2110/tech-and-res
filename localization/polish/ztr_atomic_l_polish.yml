    gov_postapocalypse:0 "Post apocalypse"
    gov_postapocalypse_desc:0 "The once prosperous nation disappeared in the midst of nuclear fire. Now the survivors are gathering to survive on the ashes and dust. The traditional administrative system has collapsed, and the armed groups that rule each region are loosely united to replace the 'government'. Industries have mostly been militarized, communications networks have been cut off, and the era has arrived where power soon works by justice."
