    # Thermonuclear Weapons Localization
    develop_thermonuclear_weapons_decision:0 "#n Thermonuclear Weapons#! Program"
    develop_thermonuclear_weapons_decision_desc:0 "We are already a nuclear power, but to truly dominate the world stage, we must develop a stronger weapon using nuclear fusion: the Thermonuclear Bomb. This weapon will have a far greater destructive power than our current atomic bombs, and will cement our position as the leading superpower."
je_develop_thermonuclear_weapons:0 "#n Thermonuclear Weapons#! Program"
gained_thermonuclear_capability.t:0 "A Stronger Nuclear Arsenal"
gained_thermonuclear_capability.d:0 "With the successful development of #V #N Thermonuclear Weapons#!#!, we have significantly enhanced its nuclear arsenal. These new weapons, which utilize nuclear fusion, possess a far greater destructive power than traditional atomic bombs. Is this to be feared or celebrated?"
je_develop_nuclear_weapons_goal:0 "Complete the #v Research#!."
je_develop_thermonuclear_weapons_goal:0 "Complete the #v Research#!."

    join_nuclear_non_proliferation_treaty_decision:0 "Join Nuclear Non-Proliferation Treaty"
    join_nuclear_non_proliferation_treaty_decision_desc:0 "The dawn of the Atomic Age has brought both immense promise and unparalleled peril. As the number of nuclear-armed states grows, so too does the risk of global catastrophe. The United Nations has therefore proposed the Nuclear Non-Proliferation Treaty (NPT); a landmark accord designed to curb the spread of nuclear weapons, advance disarmament, and encourage the peaceful use of atomic energy. By acceding to this treaty, our nation will stand among those who choose diplomacy over destruction, and cooperation over isolation."

    leave_nuclear_non_proliferation_treaty_decision:0 "Leave Nuclear Non-Proliferation Treaty"
    leave_nuclear_non_proliferation_treaty_decision_desc:0 "The Nuclear Non-Proliferation Treaty (NPT) was established to prevent the spread of nuclear weapons and promote disarmament. However, it has become clear that this treaty is hindering our nation's ability to defend itself and assert its sovereignty on the global stage. By withdrawing from the NPT, we can regain control over our nuclear program and ensure that we have the means to protect our national interests in an increasingly uncertain world."


    # NEW 1.6

    take_control_of_nuclear_arsenal_decision:0 "Take Control of Nuclear Arsenal"

    atomic_bomb_first_use.d:0 "News of unimaginable destruction has reached the world. [SCOPE.sCountry('ztr_first_nuclear_attacker').GetName] has struck [SCOPE.sState('ztr_first_nuclear_state').GetName] in [SCOPE.sCountry('ztr_first_nuclear_defender').GetName] with nuclear weapons. The first use of this terrifying force in war has changed the balance of power forever." # UPDATED
    gained_nuclear_capability.f:0 "Nuclear capability is lost if we no longer possess a Nuclear Weapons Silo, abandon military uranium use or become a subject. Silos need personnel and supplies to contribute to nuclear strike power." # UPDATED
    je_develop_nuclear_weapons_1.tt:0 "Has at least one completed Nuclear Weapons Silo with personnel and no goods shortages" # UPDATED
    je_develop_nuclear_weapons_2.tt:0 "Research is not paused by the NPT, a nuclear programme pause treaty, default or the lack of a staffed and supplied Research Center" # UPDATED
    je_develop_nuclear_weapons_reason:0 "Develop an independent #v Nuclear Weapons#! capability by completing #v 1500#! research points, researching #v $atomic_bomb$#! and operating a staffed and supplied #v $building_nuclear_weapons_silo$#!.\n\nMonthly progress is our [concept_research_capacity] minus 5, with a minimum of 1. War or a nuclear-armed rival doubles progress. The NPT, a pause treaty, default or loss of an operational Research Center suspends progress without erasing it." # UPDATED
    je_develop_thermonuclear_weapons_reason:0 "Develop #v Thermonuclear Weapons#! by completing #v 2000#! research points and researching #v $second_nuclear_reactor$#!.\n\nMonthly progress is our [concept_research_capacity] minus 5, with a minimum of 1. War or a thermonuclear-armed rival triples progress. The NPT, a pause treaty, default or loss of an operational Research Center suspends progress without erasing it. We must retain nuclear capability to continue this programme." # UPDATED
    signed_NPT_1_tt:0 "Suspends atomic and thermonuclear weapons research without erasing progress, prevents new weapons programmes and silo construction, and restricts nuclear first use. Existing arsenals are retained. Withdrawal is unavailable for at least #v 10 years#!." # UPDATED
