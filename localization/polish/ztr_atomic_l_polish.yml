je_nuclear_weapons_info_panel:0 "The Atomic Age"
je_nuclear_weapons_info_panel_reason:0 "After the discovery of the #i Atomic Bomb#! made by [SCOPE.sCountry('first_nuclear_country').GetName], the [Concept('concept_great_power', '$concept_great_powers$')] of the world have been racing to develop and expand their own nuclear arsenals in order to maintain a balance of power and deter potential adversaries from launching a nuclear attack. This has led to a dangerous escalation of tensions between nations, as each side seeks to outdo the other in terms of nuclear capabilities.\n\nThe #V #i Atomic Age#!#! has begun, and with it comes the specter of mutually assured destruction.\n\n#v RANKING BY NUCLEAR STRIKE POWER#! @nuclear_icon!:\n[SCOPE.GetRootScope.GetCountry.GetCustom('ztr_nuclear_strike_power_display_rank_1_type')][SCOPE.GetRootScope.GetCountry.GetCustom('ztr_nuclear_strike_power_display_rank_2_type')][SCOPE.GetRootScope.GetCountry.GetCustom('ztr_nuclear_strike_power_display_rank_3_type')][SCOPE.GetRootScope.GetCountry.GetCustom('ztr_nuclear_strike_power_display_rank_4_type')][SCOPE.GetRootScope.GetCountry.GetCustom('ztr_nuclear_strike_power_display_rank_5_type')]\n\n#v RANKING BY NUCLEAR STRIKE DEFENSE#! @nuclear_icon!:\n[SCOPE.GetRootScope.GetCountry.GetCustom('ztr_nuclear_strike_defence_display_rank_1_type')][SCOPE.GetRootScope.GetCountry.GetCustom('ztr_nuclear_strike_defence_display_rank_2_type')][SCOPE.GetRootScope.GetCountry.GetCustom('ztr_nuclear_strike_defence_display_rank_3_type')][SCOPE.GetRootScope.GetCountry.GetCustom('ztr_nuclear_strike_defence_display_rank_4_type')][SCOPE.GetRootScope.GetCountry.GetCustom('ztr_nuclear_strike_defence_display_rank_5_type')]"
