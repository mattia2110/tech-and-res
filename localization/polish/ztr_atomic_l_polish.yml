    take_control_of_nuclear_arsenal_decision_desc:0 "Recover a tested nuclear arsenal in a staffed and supplied silo we own. This requires atomic bomb technology, independence and no NPT commitment. An unfinished programme or an untested prototype cannot provide nuclear capability." # UPDATED
    gained_thermonuclear_capability.option:0 "Our nuclear arsenal is stronger than ever." # UPDATED
    station_nuclear_weapons_proposal_notification_effects_desc:0 "Each host country strategically adjacent to a nuclear target reduces that target's defence by 10%. Delivery range still requires strategic adjacency to the attacker or operational ICBMs." # UPDATED
    pause_nuclear_weapons_development_desc:0 "The source country pauses its atomic and thermonuclear weapons research for the duration of this [concept_article], retaining accumulated progress. The recipient's own research is unaffected." # UPDATED
    pause_nuclear_weapons_development_effects_desc:0 "The source country's atomic and thermonuclear weapons research is suspended while this [concept_article] remains in force. Accumulated progress is preserved." # UPDATED
    pause_nuclear_weapons_development_pact_desc:0 "The country providing this commitment suspends its atomic and thermonuclear weapons research, retaining accumulated progress." # UPDATED
    pause_nuclear_weapons_development_proposal_accepted_name:0 "Nuclear Weapons Research Suspended" # UPDATED
    pause_nuclear_weapons_development_proposal_accepted_desc:0 "The nuclear research pause agreement has been accepted. The country providing the commitment suspends its atomic and thermonuclear weapons programmes, retaining accumulated progress." # UPDATED
    pause_nuclear_weapons_development_action_notification_name:0 "Nuclear Weapons Research Suspended" # UPDATED
    pause_nuclear_weapons_development_action_notification_desc:0 "The source country has agreed to suspend its atomic and thermonuclear weapons programmes for the duration of the treaty." # UPDATED
    pause_nuclear_weapons_development_proposal_notification_name:0 "Suspend Nuclear Weapons Research?" # UPDATED
    pause_nuclear_weapons_development_proposal_notification_desc:0 "The proposed agreement would suspend the source country's atomic and thermonuclear weapons research without erasing accumulated progress." # UPDATED
    pause_nuclear_weapons_development_proposal_notification_effects_desc:0 "Suspends the source country's atomic and thermonuclear weapons research while the agreement remains in force." # UPDATED
    pause_nuclear_weapons_development_proposal_declined_desc:0 "The proposed nuclear research pause was rejected. No programme is suspended by this proposal." # UPDATED
    nuclear_de_escalation_treaty_desc:0 "Both countries halve their effective nuclear strike power and refrain from stationing weapons in countries strategically adjacent to the other. A withdrawing country's strike power remains halved for five years."
    nuclear_de_escalation_treaty_effects_desc:0 "Both countries' nuclear strike power is reduced by #v 50%#! while the treaty is active. A withdrawing country's power remains reduced for #v 5 years#!. Nuclear stationing agreements near the other party are restricted." # UPDATED
    nuclear_de_escalation_treaty_pact_desc:0 "Both countries maintain reduced nuclear strike power and restrict nuclear stationing near each other." # UPDATED
    nuclear_de_escalation_treaty_proposal_accepted_name:0 "Nuclear De-escalation Treaty Accepted" # UPDATED
    nuclear_de_escalation_treaty_proposal_accepted_desc:0 "[INITIATOR_COUNTRY.GetName] and [TARGET_COUNTRY.GetName] have agreed to halve their nuclear strike power and restrict nuclear stationing near each other." # UPDATED
    nuclear_de_escalation_treaty_proposal_notification_desc:0 "[INITIATOR_COUNTRY.GetName] and [TARGET_COUNTRY.GetName] would halve their nuclear strike power and restrict nuclear stationing near each other." # UPDATED
    nuclear_de_escalation_treaty_proposal_notification_effects_desc:0 "Halves both countries' effective nuclear strike power. A withdrawing country's power remains reduced for five years." # UPDATED
    nuclear_de_escalation_treaty_proposal_declined_desc:0 "[TARGET_COUNTRY.GetName] has rejected the proposed reduction of nuclear strike power and restrictions on nuclear stationing." # UPDATED
    nuclear_ultimatum_white_peace_action_notification_desc:0 "The nuclear ultimatum has led to a nuclear exchange. Damage depends on operational arsenals, national defences and delivery range." # UPDATED
    nuclear_ultimatum_white_peace_desc:0 "Demand a white peace backed by an available nuclear arsenal of our own or an ally in the same war. Refusal can trigger strikes against the opposing coalition and retaliation by countries with ready arsenals." # UPDATED
    nuclear_ultimatum_white_peace_proposal_notification_effects_desc:0 "Refusal can trigger a nuclear exchange involving other participants in the war. Retaliation requires an operational arsenal that is not rearming and can reach its target." # UPDATED
    nuclear_dev_cost:0 "Nuclear development cost" # UPDATED
    hydrogen_bomb:0 "Hydrogen Bomb" # UPDATED
    hydrogen_bomb_desc:0 "Thermonuclear weapons, also known as hydrogen bombs, represent the pinnacle of nuclear weapon technology. Unlike atomic bombs that rely solely on nuclear fission, thermonuclear weapons utilize a two-stage process that combines both fission and fusion reactions. The initial fission explosion generates the extreme temperatures and pressures necessary to ignite the fusion of hydrogen isotopes, resulting in an immensely powerful blast far exceeding that of traditional atomic bombs. The development of thermonuclear weapons has significantly altered the strategic landscape of global military power, introducing new considerations for deterrence, defense, and international relations." # UPDATED

