 je_demography_reason: "[ROOT.GetCountry.GetName] is in stage #v [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_applied_stage')|0]#! of 9 of the [Concept('concept_demographic_stages','$concept_demographic_stages$')]: [SCOPE.GetRootScope.GetCountry.GetCustom('ztr_demography_stage_flavour')].\n\n[ROOT.GetCountry.GetPopGrowthDesc]\n\nStage 1 covers #b 0 to 200#!, then every #b #white 100#! Points#! the country moves to the next stage.\n#white Yearly Progress#! is limited to #positive_value +15#! and #negative_value -5#! points.\n\nProgress is shaped by the following factors:\n[concept_demographic_drift]: [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_shown_drift')|+=1]\n[concept_social_momentum]: [ROOT.GetCountry.GetCustom('ztr_demography_social_momentum')]\n[concept_demographic_factors]: [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_shown_extra')|+=1]\n$TAB$• [GetLawGroup('lawgroup_health_system').GetName]: [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_shown_healthcare')|+=1]\n$TAB$• [GetLawGroup('lawgroup_slavery').GetName]: [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_shown_slavery')|+=1]\n$TAB$• [GetLawGroup('lawgroup_citizenship').GetName] / [GetLawGroup('lawgroup_migration').GetName]: [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_shown_immigration')|+=1]\n$TAB$• [GetLawType('law_coercive_pronatalism').GetName]: [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_shown_pronatalism')|+=1]\n$TAB$• Culture: [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_shown_traditional')|+=1][ROOT.GetCountry.GetCustom('ztr_demography_region_factor')]" # UPDATED
