l_japanese:
# Generated by scripts/ztr_sync_localization.py; edit the English source.

# Game concepts
concept_demographic_stages: "Demographic Stages"
concept_demographic_stage: "Demographic Stage"


concept_environment: "Environment"
concept_environmental: "Environmental"
concept_environment_desc: "[Concept('concept_environment','$concept_environment$')] is a concept that refers to the natural world and the impact of human activity on it. It encompasses the air, water, land, and ecosystems that support life on [Concept('concept_country','$concept_country$')] and Earth in general. The environment is crucial for the survival of all living beings, and its health is essential for the well-being of future generations. Environmentalist movements advocate for its protection, preservation and restoration, often in opposition to industrialization and economic development that can harm natural resources."

ztr_concept_colonial_state: "Colonial States"
ztr_concept_colonial_states: "Colonial States"
ztr_concept_colonial_state_desc: "A [Concept('concept_state','$concept_state$')] is considered a #v Colonial State#! when it is not a [Concept('concept_homeland','$concept_homeland$')] of the owning [Concept('concept_country','$concept_country$')]'s [Concept('concept_culture','$concept_cultures$')], and all [Concept('concept_culture','$concept_cultures$')] native to that [Concept('concept_state','$concept_state$')] wants more #v Self-Determination#! and may desire #v Independence#!.\n\nWhether a [Concept('concept_culture','$concept_culture$')] wants to be decolonized depends on how [Concept('concept_democracy','$concept_democracy_adjective$')] the ruling [Concept('concept_country','$concept_country$')] is and how accepted the [Concept('concept_culture','$concept_culture$')] is within it:\n\n- #v Full Democracies#!: cultures with [Concept('concept_acceptance','$concept_acceptance$')] below #v 55#! want to be decolonized.\n- #v Flawed Democracies#!: cultures with [Concept('concept_acceptance','$concept_acceptance$')] below #v 60#! want to be decolonized.\n- #v Non-Democracies#!: cultures with [Concept('concept_acceptance','$concept_acceptance$')] below #v 65#! want to be decolonized."
concept_decolonization: "Decolonization"
concept_decolonization_desc: "[Concept('concept_decolonization','$concept_decolonization$')] is a process that refers to the political and social movements aimed at ending [Concept('concept_colony','$concept_colonial$')] rule and establishing independence for colonized territories. It involves the dismantling of [Concept('concept_colony','$concept_colonial$')] structures, the assertion of self-determination, and the restoration of local governance. The process of [Concept('concept_decolonization','$concept_decolonization$')] can be complex and multifaceted, often involving negotiations, conflicts, and the redefinition of national identities."

concept_progressivism: "Progressivism"
concept_progressivism_desc: "[Concept('concept_progressivism','$concept_progressivism$')] is a political and social ideology that advocates for social reform, equality, and the advancement of human rights. It emphasizes the need for progressive change in society, often through government action, to address issues such as poverty, discrimination, and environmental degradation. Progressives seek to create a more just and equitable society by promoting policies that benefit the marginalized and disadvantaged, while also fostering innovation and technological advancement."

# NEW 1.5

concept_united_nations: "United Nations"

concept_liberty_index: "Liberty Index"

concept_democracy: "Democracy"
concept_democracy_adjective: "Democratic"
concept_democracy_desc: "[Concept('concept_democracy','$concept_democracy$')] is a form of government in which power is vested in the people, either directly or through elected representatives. It emphasizes the principles of political equality, individual freedoms, and the rule of law. In a [Concept('concept_democracy','$concept_democracy$')], citizens have the right to participate in decision-making processes, express their opinions, and hold their leaders accountable. Democracies often feature regular elections, free speech, and protection of minority rights, fostering a society where diverse voices can be heard and respected."

concept_autocracy: "Autocracy"
concept_autocracy_adjective: "Autocratic"
concept_autocracy_desc: "[Concept('concept_autocracy','$concept_autocracy$')] is a form of government in which absolute power is concentrated in the hands of a single ruler or a small group. In an [Concept('concept_autocracy','$concept_autocracy$')], the ruling authority has unchecked control over political, social, and economic aspects of society, often without the consent or participation of the governed. [Concept('concept_autocracy','$concept_autocracy_adjective$')] regimes may suppress dissent, limit freedoms, and centralize decision-making, leading to a lack of accountability and potential abuses of power. This form of governance contrasts sharply with [Concept('concept_democracy','$concept_democracy_adjective$')] systems, where power is distributed among the people and their elected representatives."

concept_superpower: "Superpower"

concept_equality_index: "Equality Index"
concept_equality_index_desc: "[Concept('concept_equality_index','$concept_equality_index$')] is a measure of the level of social and economic equality within [Concept('concept_country','$concept_country$')]. A higher [Concept('concept_equality_index','$concept_equality_index$')] indicates a more equitable distribution of wealth, opportunities, and resources among the population, while a lower index suggests significant disparities and social stratification. The [Concept('concept_equality_index','$concept_equality_index$')] is influenced by various factors, including government policies, social programs, and cultural attitudes towards equality and justice."


# NEW 1.6

concept_developed_country: "Developed Country"
concept_developed_country_short: "Developed"
concept_developed_countries: "Developed Countries"
concept_developed_country_desc: "A country is considered [Concept('concept_developed_country','$concept_developed_country_short$')] when it has reached a certain level of economic and social development. This includes factors such as GDP per capita, life expectancy, education levels, and industrialization. [Concept('concept_developed_country','$concept_developed_country_short$')] countries are typically characterized by advanced infrastructure, a diversified economy and a high standard of living and welfare for its citizens."

# UN law concepts
concept_un_subject_imf: "IMF"
concept_un_subject_wto: "WTO"
concept_un_subject_icc: "International Criminal Court"
concept_un_subject_unesco: "UNESCO"









concept_research_capacity: "Research Capacity"
concept_research_capacities: "Research Capacities"

# Community mechanics explanations
concept_superpower_desc: "A $concept_superpower$ is a nation whose economic, military and diplomatic reach dominates the world stage.\n\n#b Requirements#!\nResearch [GetTechnology('neoimperialism').GetName] and hold #v 1st or 2nd place#! in the global [concept_prestige] ranking. Falling below 2nd place removes it.\n\n#b Benefits while active#!\n• #P +1,000#! [concept_influence]\n• #P +500%#! [concept_power_bloc_leverage] generation\n• #P +1,000#! [concept_power_bloc_leverage] resistance\n• #P +1#! maximum [Concept('concept_company','$concept_companies$')]\n\nA $concept_superpower$ leading a [concept_power_bloc] needs #v 50#! [concept_power_bloc_leverage_advantage] to invite a country or accept its request to join. The status also allows a [concept_power_bloc_leader] to propose merging blocs, subject to the action's other requirements." # UPDATED
 concept_un_voting: "UN Proposals and Voting"
 concept_un_membership: "UN Membership"
 concept_un_human_rights: "UN Human Rights Standards"

 concept_united_nations_desc: "The $concept_united_nations$ is an international forum for diplomacy, binding human-rights standards and specialized institutions. The #v 1st-ranked#! [concept_country] can found it from #v 1945#! after researching [GetTechnology('international_organizations').GetName].\n\nOpen the #v United Nations#! [concept_journal_entry] to see the Security Council, the current rules and the institutions. Hover the name of each rule or institution to see its options and effects.\n\n• [Concept('concept_un_membership','$concept_un_membership$')]: benefits, diplomatic costs and law changes on joining.\n• [Concept('concept_un_voting','$concept_un_voting$')]: proposals, voting and vetoes.\n• [Concept('concept_un_human_rights','$concept_un_human_rights$')]: binding law standards.\n\nInstitutions: [Concept('concept_un_subject_imf','$concept_un_subject_imf$')], [Concept('concept_un_subject_wto','$concept_un_subject_wto$')], [Concept('concept_un_subject_icc','$concept_un_subject_icc$')] and [Concept('concept_un_subject_unesco','$concept_un_subject_unesco$')]. The $concept_united_nations$ can also intervene in [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')]." # UPDATED
 concept_un_voting_model: "Voting Model"
 concept_un_voting_model_desc: "The $concept_un_voting_model$ of the [Concept('concept_united_nations','$concept_united_nations$')] decides which members can vote on proposals and how much each vote weighs. It can be reformed through [Concept('concept_un_voting','$concept_un_voting$')].\n\n#b $ztr_un_law_voting_model_1$#!\n$ztr_un_law_voting_model_1_desc$\n\n#b $ztr_un_law_voting_model_2$#!\n$ztr_un_law_voting_model_2_desc$\n\n#b $ztr_un_law_voting_model_3$#!\n$ztr_un_law_voting_model_3_desc$\n\n#b $ztr_un_law_voting_model_4$#!\n$ztr_un_law_voting_model_4_desc$\n\n$ztr_un_vote_resolution_rule$"
 concept_un_veto_right: "Veto Rights"
 concept_un_veto_right_desc: "$concept_un_veto_right$ decide whether a single Permanent Member of the Security Council can block a proposal of the [Concept('concept_united_nations','$concept_united_nations$')].\n\n#b $ztr_un_law_veto_right_enabled$#!\n$ztr_un_law_veto_right_enabled_desc$\n\n#b $ztr_un_law_veto_right_disabled$#!\n$ztr_un_law_veto_right_disabled_desc$"
 concept_un_member_selection: "Permanent Member Selection"
 concept_un_decolonization: "Statement on Decolonization"
 concept_un_decolonization_desc: "The $concept_un_decolonization$ sets the common standard of the [Concept('concept_united_nations','$concept_united_nations$')] on Colonial Affairs laws. Like all [Concept('concept_un_human_rights','$concept_un_human_rights$')], it binds every member, even those that voted against.\n\n#b $ztr_un_vote_proposal_decolonization_encouraged$#!\n$ztr_un_vote_proposal_decolonization_encouraged_desc$\n\n#b $ztr_un_vote_proposal_decolonization_conservative$#!\n$ztr_un_vote_proposal_decolonization_conservative_desc$\n\n#b $ztr_un_vote_proposal_decolonization_neutral$#!\n$ztr_un_vote_proposal_decolonization_neutral_desc$"
 concept_un_slavery: "Statement on Slavery"
 concept_un_slavery_desc: "The $concept_un_slavery$ sets the common standard of the [Concept('concept_united_nations','$concept_united_nations$')] on Slavery laws. Like all [Concept('concept_un_human_rights','$concept_un_human_rights$')], it binds every member, even those that voted against.\n\n#b $ztr_un_vote_proposal_slavery_illegal$#!\n$ztr_un_vote_proposal_slavery_illegal_desc$\n\n#b $ztr_un_vote_proposal_slavery_neutral$#!\n$ztr_un_vote_proposal_slavery_neutral_desc$"
 concept_un_children_rights: "Statement on Children's Rights"
 concept_un_children_rights_desc: "The $concept_un_children_rights$ sets the common standard of the [Concept('concept_united_nations','$concept_united_nations$')] on Child Labor laws. Like all [Concept('concept_un_human_rights','$concept_un_human_rights$')], it binds every member, even those that voted against.\n\n#b $ztr_un_vote_proposal_children_rights_negligible$#!\n$ztr_un_vote_proposal_children_rights_negligible_desc$\n\n#b $ztr_un_vote_proposal_children_rights_restricted_child_labor$#!\n$ztr_un_vote_proposal_children_rights_restricted_child_labor_desc$\n\n#b $ztr_un_vote_proposal_children_rights_compulsory_study$#!\n$ztr_un_vote_proposal_children_rights_compulsory_study_desc$"
 concept_un_women_rights: "Statement on Women's Rights"
 concept_un_women_rights_desc: "The $concept_un_women_rights$ sets the common standard of the [Concept('concept_united_nations','$concept_united_nations$')] on Women's Rights laws. Like all [Concept('concept_un_human_rights','$concept_un_human_rights$')], it binds every member, even those that voted against.\n\n#b $ztr_un_vote_proposal_women_rights_negligible$#!\n$ztr_un_vote_proposal_women_rights_negligible_desc$\n\n#b $ztr_un_vote_proposal_women_rights_gender_equality$#!\n$ztr_un_vote_proposal_women_rights_gender_equality_desc$"
 concept_un_subject_wto_desc: "Once established, every UN member receives:\n• #P +10#! $state_building_construction_sector_max_level_add$\n• #P +10%#! $state_import_advantage_mult$\n• #P +10%#! $state_export_advantage_mult$\n• #N -5%#! $state_tariff_import_add$\n• #N -5%#! $state_tariff_export_add$\n\nTrade becomes more competitive, at the cost of tariff revenue and protection for domestic producers. These effects apply while the country remains in the UN." # UPDATED
 concept_un_subject_imf_desc: "The IMF and World Bank unlock targeted financial aid and a separate modernization program.\n\n#b Financial aid for UN members#!\nAid is reassessed #v yearly#! using the current average [concept_sol]. Every aid tier gives #P -3%#! $country_loan_interest_rate_add$. Other bonuses depend on the tier:\n• Below #v 6#!: #P +2#! [concept_sol], #P +600%#! $country_minting_mult$, #P +40%#! $state_construction_mult$\n• #v 6 to 7#!: #P +1.5#! [concept_sol], #P +400%#! $country_minting_mult$, #P +40%#! $state_construction_mult$\n• #v 7 to 8#!: #P +1#! [concept_sol], #P +250%#! $country_minting_mult$, #P +35%#! $state_construction_mult$\n• #v 8 to 9#!: #P +0.5#! [concept_sol], #P +150%#! $country_minting_mult$, #P +25%#! $state_construction_mult$\n• #v 9 to 10#!: #P +100%#! $country_minting_mult$, #P +15%#! $state_construction_mult$\nAid ends at the yearly review once the average [concept_sol] reaches #v 10#!.\n\n#b Modernization program#!\nIndependent countries of at least [concept_minor_power] rank may enter if [concept_gdp_per_capita] is below #v 4#!, [concept_literacy] below #v 30%#! and average [concept_sol] below #v 9.5#!. UN membership is not required. While active it gives #P +5%#! $country_tech_spread_mult$ and #N -5%#! [concept_bureaucracy]; its events and projects may bring further costs. Complete it by exceeding #v 35%#! [concept_literacy], #v 10#! average [concept_sol] and #v 5#! [concept_gdp_per_capita] to gain #P +25%#! $country_tech_research_speed_mult$ for #v 25 years#!." # UPDATED
 concept_un_environment: "Statement on the Environment"
 concept_un_environment_desc: "The $concept_un_environment$ sets the common standard of the [Concept('concept_united_nations','$concept_united_nations$')] on Environmental Policy laws. Like all [Concept('concept_un_human_rights','$concept_un_human_rights$')], it binds every member, even those that voted against.\n\n#b $ztr_un_vote_proposal_environment_negligible$#!\n$ztr_un_vote_proposal_environment_negligible_desc$\n\n#b $ztr_un_vote_proposal_environment_basic_protection$#!\n$ztr_un_vote_proposal_environment_basic_protection_desc$"
 concept_un_labor_rights: "Statement on Labor Rights"
 concept_un_labor_rights_desc: "The $concept_un_labor_rights$ sets the common standard of the [Concept('concept_united_nations','$concept_united_nations$')] on Labor Rights laws, following the conventions of the International Labour Organization. Like all [Concept('concept_un_human_rights','$concept_un_human_rights$')], it binds every member, even those that voted against.\n\n#b $ztr_un_vote_proposal_labor_rights_negligible$#!\n$ztr_un_vote_proposal_labor_rights_negligible_desc$\n\n#b $ztr_un_vote_proposal_labor_rights_regulatory_bodies$#!\n$ztr_un_vote_proposal_labor_rights_regulatory_bodies_desc$\n\n#b $ztr_un_vote_proposal_labor_rights_worker_protections$#!\n$ztr_un_vote_proposal_labor_rights_worker_protections_desc$"
 concept_political_pole: "Ideological Pole" # UPDATED
 concept_ideology_index: "Ideology Index"
 concept_ideology_index_desc: "The [Concept('concept_ideology_index','$concept_ideology_index$')] of a [concept_country] combines its [Concept('concept_liberty_index','$concept_liberty_index$')] and [Concept('concept_equality_index','$concept_equality_index$')], both shaped by most of the [Concept('concept_law','$concept_laws$')] in force. A [Concept('concept_democracy','$concept_democracy_adjective$')] country usually reaches a higher [Concept('concept_liberty_index','$concept_liberty_index$')], while an [Concept('concept_autocracy','$concept_autocracy_adjective$')] one restricts individual freedoms. Redistribution and social programs raise the [Concept('concept_equality_index','$concept_equality_index$')], while free-market policies accept greater economic disparities.\n\nTogether, the two indices place a country in an [Concept('concept_political_pole','$concept_political_pole$')]."
 concept_political_pole_desc: "A [Concept('concept_political_pole','$concept_political_pole$')] is the long-term political character of a [concept_country], given by its [Concept('concept_liberty_index','$concept_liberty_index$')] and [Concept('concept_equality_index','$concept_equality_index$')] together:\n\n #positive_value Social#!: democratic and egalitarian\n #blue_value Liberal#!: democratic and individualist\n #negative_value Collectivist#!: authoritarian and egalitarian\n #gold_value Reactionary#!: authoritarian and individualist\n\nA country is democratic from #v 50#! [Concept('concept_liberty_index','$concept_liberty_index$')] and egalitarian from #v 70#! [Concept('concept_equality_index','$concept_equality_index$')]. Once assigned, a [Concept('concept_political_pole','$concept_political_pole$')] changes only when an index moves #v 1#! point past its threshold. Countries #v 20#! points past the threshold, with a [Concept('concept_liberty_index','$concept_liberty_index$')] of at least #v 70#! or below #v 30#!, form the #v core#! of their pole.\n\nPoles emerge with the age of mass politics, once [GetTechnology('political_agitation').GetName] is researched." # UPDATED
 concept_liberty_index_desc: "[Concept('concept_liberty_index','$concept_liberty_index$')] represents the level of personal and political freedoms enjoyed by the citizens of [Concept('concept_country','$concept_country$')]. An higher [Concept('concept_liberty_index','$concept_liberty_index$')] indicates a more open and [Concept('concept_democracy','$concept_democracy_adjective$')] society, while a lower index suggests a more [Concept('concept_autocracy','$concept_autocracy_adjective$')] regime, a dictatorship, or even a dystopia. The [Concept('concept_liberty_index','$concept_liberty_index$')] is influenced by most of the laws in place within the country.\n\n#negative_value Important#!: The #gold_value Law Group#! [GetLawGroup('lawgroup_distribution_of_power').GetName] will limit your maximum [Concept('concept_liberty_index','$concept_liberty_index$')]. A [GetPlayer.GetCustom('ztrpol_single_party_law_name')] with [GetLawType('law_secret_police').GetName] and [GetLawType('law_outlawed_dissent').GetName] loses a further #negative_value 12#! points; [GetLawType('law_secret_police').GetName] with [GetLawType('law_censorship').GetName], with or without a single party, loses #negative_value 6#!." # UPDATED
 concept_literate_citizens: "Literate Citizens"
 concept_research_capacity_desc: "[Concept('concept_research_capacity','$concept_research_capacity$')] measures how much scientific work a [Concept('concept_country','$concept_country$')] can actually direct, as opposed to how much science it happens to absorb from abroad. It is the pace at which the National Research Center pushes its programs forward, and it is built from three things:\n\n[Concept('concept_literate_citizens','$concept_literate_citizens$')], and by far the largest contribution.\n\n#v Country Development Level#!.\n\n#v $ztr_research_agreement$s#!: up to #v 2#! points each, less with a smaller partner or cold [concept_relations]. At most #v 6#! points, #v 8#! with [GetTechnology('funded_research_projects').GetName].\n\nWhat each point grants depends on the [Concept('concept_research_philosophy','$concept_research_philosophy$')] chosen in the National Research Center." # UPDATED
 concept_research_philosophy: "Research Philosophy"
 concept_literate_citizens_desc: "[Concept('concept_literate_citizens','$concept_literate_citizens$')] are the people of a [concept_country] who can read and write: its total [Concept('concept_pop','$concept_population$')] multiplied by its [Concept('concept_literacy','$concept_literacy$')]. A large educated population can sustain advanced academic and scientific institutions even where the national literacy rate is low, and it is the largest source of [Concept('concept_research_capacity','$concept_research_capacity$')]." # UPDATED
 concept_climate_stage: "Climate Stage"
 concept_effective_pollution: "Effective Pollution"
 concept_effective_pollution_desc: "$concept_effective_pollution$ is the pollution a [concept_country] adds to the atmosphere each year, and what drives global warming. It is the [concept_generated_pollution] of all its [Concept('concept_state','$concept_states$')], reduced by:\n\n• [GetLawType('law_basic_protection').GetName] #positive_value -5%#! or [GetLawType('law_active_restoration').GetName] #positive_value -10%#!\n• [GetInstitutionType('institution_environmental_policy').GetName]: #positive_value -5%#! per level, up to #positive_value -25%#!\n• [GetLawType('law_mining_restrict_hazardous').GetName] #positive_value -2%#!, [GetLawType('law_mining_strategic').GetName] #positive_value -5%#! or [GetLawType('law_polluting_mining_banned').GetName] #positive_value -10%#!\n• [GetTechnology('urban_sustainability').GetName]: #positive_value -10%#!\n\nReductions multiply each other. More industry and polluting [Concept('concept_production_method','$concept_production_methods$')] raise it, while cleaner ones such as carbon capture lower it at the source."
 concept_climate_stage_desc: "The $concept_climate_stage$ measures how far global warming has advanced, based on the rise of the global average temperature above the #v Pre-Industrial Age#!. Every #v +1 °C#! adds #negative_value +100%#! to the base chance of [GetHarvestConditionType('drought').GetName], [GetHarvestConditionType('heatwave').GetName], [GetHarvestConditionType('wildfire').GetName] and of every extreme climate disaster.\n\n#positive_value Historical Range#! (up to +0.5 °C): no extreme climate disasters.\n#v Detection#! (above +0.5 °C): warming caused by pollution becomes measurable; no new disasters yet.\n#negative_value The Thaw#! (above +1.0 °C): [GetHarvestConditionType('ztr_extreme_heatwave').GetName] and [GetHarvestConditionType('ztr_megadrought').GetName] can strike. Extreme climate disasters gain #negative_value +1#! [concept_harvest_condition_intensity].\n#negative_value Rising Seas#! (above +1.5 °C): [GetHarvestConditionType('ztr_hurricane').GetName] can hit cyclone coasts and [GetHarvestConditionType('ztr_extreme_wildfire').GetName] can strike. Intensity bonus rises to #negative_value +2#!.\n#negative_value Critical Warming#! (above +2.0 °C): [GetHarvestConditionType('ztr_coastal_flooding').GetName] can submerge low-lying coasts. Intensity bonus rises to #negative_value +3#!." # UPDATED

 concept_demographic_drift: "Demographic Drift"
 concept_demographic_factors: "Demographic Factors"

 concept_social_momentum: "Social Momentum"

 concept_demographic_stages_desc: "[Concept('concept_demographic_stages','$concept_demographic_stages$')] describe the demographic evolution of a [Concept('concept_country','$concept_country$')], measured by a score from #b 0 to 1000#!.\nStage 1 covers #b 0 to 200#!, then every #b #white 100#! Points#! the country moves to the next stage.\n#white Yearly Progress#! is limited to #positive_value +15#! and #negative_value -5#! points, and depends on [concept_demographic_drift], [concept_social_momentum] and [concept_demographic_factors].\n\n#v 1. Pre-Industrial#!:\n[GetStaticModifier('demographic_stage_1').GetDesc]\n#v 2. Early Industrial#!:\n[GetStaticModifier('demographic_stage_2').GetDesc]\n#v 3. Mid Industrial#!:\n[GetStaticModifier('demographic_stage_3').GetDesc]\n#v 4. Late Industrial#!:\n[GetStaticModifier('demographic_stage_4').GetDesc]\n#v 5. Early Post-Industrial#!:\n[GetStaticModifier('demographic_stage_5').GetDesc]\n#v 6. Mid Post-Industrial#!:\n[GetStaticModifier('demographic_stage_6').GetDesc]\n#v 7. Late Post-Industrial#!:\n[GetStaticModifier('demographic_stage_7').GetDesc]\n#v 8. Stagnant Stage#!:\n[GetStaticModifier('demographic_stage_8').GetDesc]\n#v 9. Declining Stage#!:\n[GetStaticModifier('demographic_stage_9').GetDesc]" # UPDATED

 concept_social_momentum_desc: "$concept_social_momentum$ compares today's [concept_sol] and GDP per capita with those of #b five years earlier#!. Growth above #b 4%#! counts as improvement.\n\n#white Stages 1 to 6#!:\n• Improvement #positive_value speeds up#! the transition.\n• Stagnation or recession #negative_value slows it down#!.\n\n#white Stage 7 onward#!:\n• Improvement #negative_value slows down#! the transition.\n• Stagnation or recession #positive_value speeds it up#!.\n\nIts strength grows with [concept_literacy]. It needs #b five years#! of recorded history." # UPDATED

 concept_demographic_factors_desc: "$concept_demographic_factors$ #b speed up#! or #b hold back#! the [Concept('concept_demographic_stages','$concept_demographic_stages$')] regardless of [concept_literacy] and [concept_sol]:\n• #b Healthcare Laws#!: [GetLawType('law_private_health_insurance').GetName] or [GetLawType('law_public_health_insurance').GetName] speed up stages 1 to 6.\n• #b Slavery Laws#!: legal slavery slows down the transition from stage 2.\n• #b Immigration Laws#!: [GetLawType('law_multicultural').GetName] or [GetLawType('law_no_migration_controls').GetName] slow it down from stage 3, more in later stages. Only in the Americas or below 200 million inhabitants.\n• #b Culture#!: a Sunni or Shia [concept_state_religion], or [GetLawType('law_hindu_caste_enforced').GetName] or [GetLawType('law_hindu_caste_codified').GetName] in [GetLawGroup('lawgroup_caste_hegemony').GetName], slow down stages 1 to 4.\n\nCountries in the #b Americas#! and #b Oceania#! have a slower demographic transition." # UPDATED

 concept_demographic_drift_desc: "$concept_demographic_drift$ is the structural push on the [Concept('concept_demographic_stages','$concept_demographic_stages$')]. It grows with:\n• [concept_literacy]: the #b main factor#!.\n• [concept_sol]: the push grows up to #b 20#!. From stage #b 6#!, a higher [concept_sol] adds a further push, strongest around #b 25#!.\n• #b Time#!: it grows every 30 years from #b 1880#!.\n\nThe push #b shrinks#! as the stage advances: a country whose stage is ahead of its literacy and living standards #b falls back#!." # UPDATED

 concept_un_human_rights_desc: "UN human-rights resolutions directly change incompatible [Concept('concept_law','$concept_laws$')] in member countries when adopted and when a country joins. They also block members from enacting laws below the adopted standard. Standards that require a technology or a level of development apply as soon as a member meets them. These obligations apply even to members that voted against.\n\nThe highest standards of the [concept_un_children_rights], the [concept_un_women_rights] and the [concept_un_labor_rights] are not imposed: every #v 5#! years, members that fall short are asked to enact [GetLawType('law_compulsory_primary_school').GetName], [GetLawType('law_women_in_the_workplace').GetName] or [GetLawType('law_worker_protections').GetName]. Refusing adds #N 5#! [concept_infamy] and a [Concept('concept_un_condemnation','$concept_un_condemnation$')]; a second one means expulsion.\n\nSix statements are available: [Concept('concept_un_decolonization','$concept_un_decolonization$')], [Concept('concept_un_slavery','$concept_un_slavery$')], [concept_un_children_rights], [concept_un_women_rights], [concept_un_environment] and [concept_un_labor_rights]." # UPDATED

 concept_un_subject_unesco_desc: "Once established, every UN member receives:\n• #P +50#! $country_tech_spread_add$\n• #N -25%#! $state_assimilation_mult$\n• #N -25%#! $country_prestige_from_army_power_projection_mult$\n• #N -25%#! $country_prestige_from_navy_power_projection_mult$\n\nUNESCO carries knowledge across borders, but its members commit to protecting cultural diversity and promoting a culture of peace. These effects apply while the country remains in the UN.\n\nEvery #v 5#! years, UNESCO also asks members with [GetLawType('law_no_schools').GetName] or [GetLawType('law_terakoya').GetName] to build a school system, preferably through [GetLawType('law_public_schools').GetName]. Refusing adds #N 5#! [concept_infamy] and a [Concept('concept_un_condemnation','$concept_un_condemnation$')]." # UPDATED

 concept_un_condemnation: "UN Condemnation"

 concept_un_condemnation_desc: "A member of the [Concept('concept_united_nations','$concept_united_nations$')] is condemned when it refuses a UN reform request, defies a UN intervention or keeps colonial or slave-holding practices banned by UN statements. Condemnations add up:\n• #b First condemnation#!: $ztr_un_condemned_modifier$ (#N -10%#! [concept_prestige], #N -15%#! [concept_influence], #N -10#! [concept_legitimacy]) and #N suspension#!: the country can neither vote nor propose reforms.\n• #b Second condemnation#!: the penalties are #N doubled#! and the country is #N expelled#! from the UN.\n\nThe count resets #v 10 years#! after the first condemnation: the penalties end and an expelled country may apply to join again. In cases of aggression, colonial rule or slavery, the [Concept('concept_un_subject_icc','$concept_un_subject_icc$')], once established, opens its own investigation on top of the condemnation." # UPDATED

 concept_un_member_selection_desc: "The $concept_un_member_selection$ rule of the [Concept('concept_united_nations','$concept_united_nations$')] decides how the permanent seats of the Security Council are assigned. Permanent Members can propose reforms and, while [Concept('concept_un_veto_right','$concept_un_veto_right$')] are enabled, veto proposals.\n\n#b $ztr_un_law_member_selection_1$#!\n$ztr_un_law_member_selection_1_desc$\n\n#b $ztr_un_law_member_selection_2$#!\n$ztr_un_law_member_selection_2_desc$\n\n#b $ztr_un_law_member_selection_3$#!\n$ztr_un_law_member_selection_3_desc$\n\n#b $ztr_un_law_member_selection_4$#!\n$ztr_un_law_member_selection_4_desc$\n\n#b Candidacy#!\nUnder $ztr_un_law_member_selection_1$, $ztr_un_law_member_selection_3$ and $ztr_un_law_member_selection_4$, a strong Ordinary Member can run for a permanent seat once every #v 30#! years: one of the #v 4#! strongest countries, or one of the #v 2#! strongest under $ztr_un_law_member_selection_4$. If the vote passes, it takes a vacant seat or replaces the weakest Permanent Member, which cannot use its veto in that vote.\n\n#b Elected seats#!\nEvery #v 9#! years, #v 4#! Ordinary Members of at least minor power rank are drawn at random for elected seats; members of the previous round cannot be drawn again. Elected members can propose human rights statements co-signed by a Permanent Member, and they vote when only the Security Council votes. The draw is repeated whenever the Permanent Members change." # UPDATED

 concept_un_subject_icc_desc: "Once established, every UN member receives:\n• #P +5#! $country_legitimacy_base_add$\n• #N +15%#! $country_infamy_generation_mult$\n\nAt the #v yearly review#!, UN members with #v 60 or more#! [concept_infamy] are placed under investigation for #v 5 years#!:\n• #N -25%#! $country_prestige_mult$\n• #N -50%#! $country_influence_mult$\n• #N -10%#! $country_infamy_decay_mult$\n\nStaying at or above the threshold renews the investigation at later reviews." # UPDATED

 concept_un_subject_iaea: "IAEA"
 concept_un_subject_iaea_desc: "The International Atomic Energy Agency oversees the peaceful use of nuclear energy and the reduction of nuclear arsenals. It can be proposed once the first atomic bomb has been used.\n\nOnce established, countries can sign the nuclear de-escalation treaties: #v $nuclear_de_escalation_treaty$#! and #v $pause_nuclear_weapons_development$#!."

 concept_un_membership_desc: "#b Benefits and costs for all members#!\n• #P +100#! weekly [concept_innovation]\n• #P +25#! [concept_legitimacy], scaled by the vote share of the parties in government\n• #v -80%#! [concept_migration] quota\n• #v -25%#! [concept_prestige] from army [concept_power_projection]\n\n#b Ordinary Members#!\n#N -25%#! [concept_influence], #N +50%#! [concept_infamy] generation and #P -5 percentage points#! [concept_loans] interest rate.\n\n#b Permanent Members#!\n#N -30%#! [concept_influence] and #N +35%#! [concept_infamy] generation. They can propose resolutions and, while veto rights are enabled, veto them.\n\n#b Joining#!\nJoining grants recognition to unrecognized countries and immediately adjusts laws:\n• [GetLawType('law_no_health_system').GetName] becomes [GetLawType('law_charitable_health_system').GetName]\n• [GetLawType('law_outlawed_dissent').GetName] becomes [GetLawType('law_censorship').GetName]\n• [GetLawType('law_ethnostate').GetName] or [GetLawType('law_national_supremacy').GetName] becomes [GetLawType('law_racial_segregation').GetName]\nActive [Concept('concept_un_human_rights','$concept_un_human_rights$')] also apply.\n\nEstablished [Concept('concept_un_subject_wto','$concept_un_subject_wto$')], [Concept('concept_un_subject_icc','$concept_un_subject_icc$')] and [Concept('concept_un_subject_unesco','$concept_un_subject_unesco$')] give additional bonuses. The [Concept('concept_un_subject_imf','$concept_un_subject_imf$')] targets low living standards instead of giving every member the same bonus.\n\nOrdinary Members can withdraw through a decision after researching [GetTechnology('international_organizations').GetName], from 1946 onward and outside an ongoing vote. Withdrawal adds #N 25#! [concept_infamy] and removes the UN, WTO, ICC and UNESCO membership modifiers.\n\n#b UN contributions#!\nEvery year each member owes #v 0.25%#! of its GDP, doubled once the [Concept('concept_un_subject_imf','$concept_un_subject_imf$')] exists and doubled again for Permanent Members, scaled by its development level: nothing at the lowest level, the full amount at the highest. It is paid every week under Additional Expenses in the budget. A condemned member pays nothing but loses its vote; withholding the contribution is itself a [Concept('concept_un_condemnation','$concept_un_condemnation$')]." # UPDATED
 concept_un_voting_desc: "Permanent Members of the Security Council can propose changes through the #v United Nations#! [concept_journal_entry]. After #v 30 days#! of discussion, eligible voters receive an event and the #v UN Vote Session#! [concept_journal_entry] opens for #v six months#!.\n\nVote through the event or the #v Vote In Favor#! and #v Vote Against#! buttons of the [concept_journal_entry]. You may change your vote until the session closes. If you postpone your decision, you are counted as neutral; neutral votes add neither support nor opposition.\n\nEligibility and vote weight depend on the current [Concept('concept_un_voting_model','$concept_un_voting_model$')]. A proposal passes only when #P support exceeds opposition#! at the end of the session; a tie fails. If [Concept('concept_un_veto_right','$concept_un_veto_right$')] are enabled, #N a Permanent Member can block the proposal by casting a veto#!; a veto that blocks a majority can be cast again only after #v 10 years#!.\n\nAdopted effects apply to all UN members, including those that opposed the proposal. After a session closes, AI members will not put forward new proposals for #v 4 years#!." # UPDATED
 concept_research_philosophy_desc: "The [Concept('concept_research_philosophy','$concept_research_philosophy$')] sets how the National Research Center uses each point of [Concept('concept_research_capacity','$concept_research_capacity$')]:\n\n#v Independent Research#!: #P +4#! maximum [Concept('concept_innovation','$concept_innovation$')] and #N -0.5%#! [Concept('concept_technology_spread','$concept_technology_spread$')]. A large scientific establishment sets its own direction, but is slower to adopt foreign discoveries. Best suited to countries with more than #v 40 million#! [Concept('concept_literate_citizens','$concept_literate_citizens$')].\n\n#v Technology Absorption#!: #P +3%#! [Concept('concept_technology_spread','$concept_technology_spread$')]. A smaller establishment learns faster from abroad.\n\nIt can then be changed once every #v 10#! years." # UPDATED
