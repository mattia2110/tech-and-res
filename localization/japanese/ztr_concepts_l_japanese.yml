concept_un_voting_model_security_council_only: "Security Council Only"
concept_un_voting_model_superpowers_only: "Superpowers Only"

concept_un_veto_right_enabled: "Enabled"
concept_un_veto_right_disabled: "Abolished"

concept_un_member_selection_by_prestige: "By Prestige"
concept_un_member_selection_geographic_representation: "Geographic Representation"
concept_un_member_selection_by_military_power: "By Military Power"
concept_un_member_selection_strongest_country: "Strongest Country"

concept_un_decolonization_encouraged: "Encourage Decolonization"
concept_un_decolonization_conservative: "Colonization As Is"
concept_un_decolonization_neutral: "No UN Statement"

concept_un_slavery_illegal: "Slavery Banned"
concept_un_slavery_neutral: "No UN Statement"

concept_un_children_rights_negligible: "Negligible"
concept_un_children_rights_restricted_child_labor: "Restricted Child Labor"
concept_un_children_rights_compulsory_study: "Child Labor Banned"

concept_un_women_rights_negligible: "Negligible"
concept_un_women_rights_gender_equality: "Gender Equality"

concept_un_institution_imf_not_established: "Not Established"
concept_un_institution_imf_established: "Established"
concept_un_institution_wto_not_established: "Not Established"
concept_un_institution_wto_established: "Established"
concept_un_institution_icc_not_established: "Not Established"
concept_un_institution_icc_established: "Established"
concept_un_institution_unesco_not_established: "Not Established"
concept_un_institution_unesco_established: "Established"

concept_research_capacity: "Research Capacity"
concept_research_capacities: "Research Capacities"
concept_research_capacity_desc: "[Concept('concept_research_capacity','$concept_research_capacity$')] measures how much scientific work a [Concept('concept_country','$concept_country$')] can actually direct, as opposed to how much science it happens to absorb from abroad. It is the pace at which the National Research Center pushes its programs forward, and it is built from three things:\n\n#v Literate Population#!, and by far the largest contribution.\n\n#v Country Development Level#!.\n\n#v Research Coop Treaties#!: one point per agreement, up to #v 3#!, rising to #v 5#! for #blue_value UNESCO#! members.\n\nEach point grants #P +5#! maximum [Concept('concept_innovation','$concept_innovation$')] and #N -1%#! [Concept('concept_technology_spread','$concept_technology_spread$')]. A large scientific establishment sets its own direction, but it is also slower to fully adapt."
concept_demographic_stages_desc: "[Concept('concept_demographic_stages','$concept_demographic_stages$')] describe a [Concept('concept_country','$concept_country$')]'s demographic development on a continuous scale from 0 to 900. Every 100 points determines a stage, with stage 8 extending to 900. Progress can advance or reverse according to literacy, economic change and social conditions.\n\n0.#v Pre-Industrial#!:\n[GetStaticModifier('demographic_stage_0').GetDesc]\n1.#v Early Industrial#!:\n[GetStaticModifier('demographic_stage_1').GetDesc]\n2.#v Mid Industrial#!:\n[GetStaticModifier('demographic_stage_2').GetDesc]\n3.#v Late Industrial#!:\n[GetStaticModifier('demographic_stage_3').GetDesc]\n4.#v Early Post-Industrial#!:\n[GetStaticModifier('demographic_stage_4').GetDesc]\n5.#v Mid Post-Industrial#!:\n[GetStaticModifier('demographic_stage_5').GetDesc]\n6.#v Late Post-Industrial#!:\n[GetStaticModifier('demographic_stage_6').GetDesc]\n7.#v Stagnant Stage#!:\n[GetStaticModifier('demographic_stage_7').GetDesc]\n8.#v Declining Stage#!:\n[GetStaticModifier('demographic_stage_8').GetDesc]" # UPDATED

# Community mechanics explanations
concept_superpower_desc: "A $concept_superpower$ is a nation whose economic, military and diplomatic reach dominates the world stage.\n\n#b Requirements#!\nResearch [GetTechnology('neoimperialism').GetName] and hold #v 1st or 2nd place#! in the global [concept_prestige] ranking. Falling below 2nd place removes it.\n\n#b Benefits while active#!\n• #P +1,000#! [concept_influence]\n• #P +500%#! [concept_power_bloc_leverage] generation\n• #P +1,000#! [concept_power_bloc_leverage] resistance\n• #P +1#! maximum [Concept('concept_company','$concept_companies$')]\n\nA $concept_superpower$ leading a [concept_power_bloc] needs #v 50#! [concept_power_bloc_leverage_advantage] to invite a country or accept its request to join. The status also allows a [concept_power_bloc_leader] to propose merging blocs, subject to the action's other requirements." # UPDATED
concept_united_nations_desc: "The $concept_united_nations$ is an international forum for diplomacy, binding human-rights standards and specialized institutions. The #v 1st-ranked#! [concept_country] can found it from #v 1945#! after researching [GetTechnology('international_organizations').GetName].\n\nOpen the #v United Nations#! [concept_journal_entry] to see the Security Council, the current rules and the institutions. Hover the institution names and statuses for their effects.\n\n• [Concept('concept_un_membership','$concept_un_membership$')]: benefits, diplomatic costs and law changes on joining.\n• [Concept('concept_un_voting','$concept_un_voting$')]: proposals, voting and vetoes.\n• [Concept('concept_un_human_rights','$concept_un_human_rights$')]: binding law standards.\n\nInstitutions: [Concept('concept_un_subject_imf','$concept_un_subject_imf$')], [Concept('concept_un_subject_wto','$concept_un_subject_wto$')], [Concept('concept_un_subject_icc','$concept_un_subject_icc$')] and [Concept('concept_un_subject_unesco','$concept_un_subject_unesco$')]. The $concept_united_nations$ can also intervene in [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')]." # UPDATED
 concept_un_voting: "UN Proposals and Voting"
 concept_un_voting_desc: "Permanent Members of the Security Council can propose changes through the #v United Nations#! [concept_journal_entry]. After #v 30 days#! of discussion, eligible voters receive an event and the #v UN Vote Session#! [concept_journal_entry] opens for #v one year#!.\n\nVote through the event or the #v Vote In Favor#! and #v Vote Against#! buttons of the [concept_journal_entry]. You may change your vote until the session closes. If you postpone your decision, you are counted as neutral; neutral votes add neither support nor opposition.\n\nEligibility and vote weight depend on the current Voting Model. A proposal passes only when #P support exceeds opposition#! at the end of the session; a tie fails. If veto rights are enabled, #N any Permanent Member voting against blocks the proposal#!.\n\nAdopted effects apply to all UN members, including those that opposed the proposal. After a session closes, AI members will not put forward new proposals for #v 4 years#!."
 concept_un_membership: "UN Membership"
 concept_un_membership_desc: "#b Benefits and costs for all members#!\n• #P +100#! weekly [concept_innovation]\n• #P +25#! [concept_legitimacy], scaled by the vote share of the parties in government\n• #v -80%#! [concept_migration] quota\n• #v -50%#! [concept_prestige] from army [concept_power_projection]\n\n#b Ordinary Members#!\n#N -25%#! [concept_influence], #N +50%#! [concept_infamy] generation and #P -5 percentage points#! [concept_loans] interest rate.\n\n#b Permanent Members#!\n#N -30%#! [concept_influence] and #N +35%#! [concept_infamy] generation. They can propose resolutions and, while veto rights are enabled, veto them.\n\n#b Joining#!\nJoining grants recognition to unrecognized countries and immediately adjusts laws:\n• [GetLawType('law_no_health_system').GetName] becomes [GetLawType('law_charitable_health_system').GetName]\n• [GetLawType('law_outlawed_dissent').GetName] becomes [GetLawType('law_censorship').GetName]\n• [GetLawType('law_ethnostate').GetName] or [GetLawType('law_national_supremacy').GetName] becomes [GetLawType('law_racial_segregation').GetName]\nActive [Concept('concept_un_human_rights','$concept_un_human_rights$')] also apply.\n\nEstablished [Concept('concept_un_subject_wto','$concept_un_subject_wto$')], [Concept('concept_un_subject_icc','$concept_un_subject_icc$')] and [Concept('concept_un_subject_unesco','$concept_un_subject_unesco$')] give additional bonuses. The [Concept('concept_un_subject_imf','$concept_un_subject_imf$')] targets low living standards instead of giving every member the same bonus.\n\nOrdinary Members can withdraw through a decision after researching [GetTechnology('international_organizations').GetName], from 1946 onward and outside an ongoing vote. Withdrawal adds #N 25#! [concept_infamy] and removes the UN, WTO, ICC and UNESCO membership modifiers."
 concept_un_human_rights: "UN Human Rights Standards"
 concept_un_human_rights_desc: "UN human-rights resolutions directly change incompatible [Concept('concept_law','$concept_laws$')] in member countries when adopted and when a country joins. They also block members from enacting laws below the adopted standard. These obligations apply even to members that voted against.\n\nThe covered subjects are Decolonization, Slavery, Children's Rights and Women's Rights."
concept_un_subject_imf_desc: "The IMF and World Bank unlock targeted financial aid and a separate modernization program.\n\n#b Financial aid for UN members#!\nAid is reassessed #v yearly#! using the current average [concept_sol]. Every aid tier reduces the [concept_loans] interest rate by #P 3 percentage points#!. Other bonuses depend on the tier:\n• Below #v 6#!: #P +2#! [concept_sol], #P +600%#! Minting, #P +40%#! State construction efficiency\n• #v 6 to 7#!: #P +1.5#! [concept_sol], #P +400%#! Minting, #P +40%#! State construction efficiency\n• #v 7 to 8#!: #P +1#! [concept_sol], #P +250%#! Minting, #P +35%#! State construction efficiency\n• #v 8 to 9#!: #P +0.5#! [concept_sol], #P +150%#! Minting, #P +25%#! State construction efficiency\n• #v 9 to 10#!: #P +100%#! Minting, #P +15%#! State construction efficiency\nAid ends at the yearly review once the average [concept_sol] reaches #v 10#!.\n\n#b Modernization program#!\nIndependent countries of at least [concept_minor_power] rank may enter if [concept_gdp_per_capita] is below #v 4#!, [concept_literacy] below #v 30%#! and average [concept_sol] below #v 9.5#!. UN membership is not required. While active it gives #P +5%#! [concept_technology_spread] and #N -5%#! [concept_bureaucracy]; its events and projects may bring further costs. Complete it by exceeding #v 35%#! [concept_literacy], #v 10#! average [concept_sol] and #v 5#! [concept_gdp_per_capita] to gain #P +25%#! research speed for #v 25 years#!." # UPDATED
concept_un_subject_wto_desc: "Once established, every UN member receives #P +10#! maximum Construction Sector levels per state, #P +10%#! Import advantage and #P +10%#! Export advantage.\n\nImport and Export [concept_tariffs] are both reduced by #v 5 percentage points#!. Trade becomes more competitive, at the cost of tariff revenue and protection for domestic producers." # UPDATED
concept_un_subject_icc_desc: "Once established, every UN member receives #P +5#! base [concept_legitimacy] and #N +15%#! [concept_infamy] generation.\n\nAt the #v yearly review#!, UN members with #v 60 or more#! [concept_infamy] are placed under investigation for #v 5 years#!: #N -25%#! [concept_prestige], #N -50%#! [concept_influence], #N -15#! base [concept_legitimacy] and #N -10%#! [concept_infamy] decay. Staying at or above the threshold renews the investigation at later reviews." # UPDATED
concept_un_subject_unesco_desc: "Once established, every UN member receives #P +50#! [concept_technology_spread] and #P +5 percentage points#! [concept_education_access] in its states.\n\nThese bonuses apply while the country remains in the UN, at no additional cost." # UPDATED
concept_un_voting_model_one_country_one_vote_desc: "Every UN member is eligible and has exactly #v 1#! vote. Population, [concept_prestige] and military strength do not change its vote weight. $ztr_un_vote_resolution_rule$" # UPDATED
concept_un_voting_model_weighted_by_prestige_desc: "Every UN member is eligible, with weight set by its [concept_rank] when the proposal starts: [concept_great_powers] have #v 25#! votes, [concept_major_powers] #v 10#!, [concept_minor_powers] #v 5#! and all others #v 1#!. $ztr_un_vote_resolution_rule$" # UPDATED
concept_un_voting_model_security_council_only_desc: "Only Permanent Members of the Security Council are eligible, with #v 1#! vote each. Ordinary Members remain bound by adopted resolutions. $ztr_un_vote_resolution_rule$" # UPDATED
concept_un_voting_model_superpowers_only_desc: "Only the #v two UN members with the highest [concept_prestige]#! when the proposal starts are eligible, with #v 1#! vote each; [Concept('concept_superpower','$concept_superpower$')] status is not required. All UN members remain bound by adopted resolutions. With only two voters, one vote for and one against is a tie and fails. $ztr_un_vote_resolution_rule$" # UPDATED
concept_un_veto_right_enabled_desc: "Any Permanent Member of the Security Council voting #N against#! blocks the proposal, even when support outweighs opposition. Neutral members do not veto. The veto applies to governance, human-rights and institution proposals alike." # UPDATED
concept_un_veto_right_disabled_desc: "Opposition by a Permanent Member no longer blocks proposals by itself. A proposal passes when its support exceeds opposition at the end of the session; ties fail." # UPDATED
concept_un_member_selection_by_prestige_desc: "Adopting this reform demotes all current Permanent Members to Ordinary Members, then appoints the #v three UN members with the highest [concept_prestige]#!. This can transfer proposal and veto powers to different countries." # UPDATED
concept_un_member_selection_geographic_representation_desc: "Adopting this reform demotes current Permanent Members and appoints the UN member with the highest [concept_prestige] in each of five regional groups: Europe; the Americas; East Asia, Southeast Asia and Oceania; the Middle East, Central Asia and India; and Africa. Groups without an eligible member receive no seat. Selected countries gain proposal and, when enabled, veto powers." # UPDATED
concept_un_member_selection_by_military_power_desc: "Adopting this reform demotes current Permanent Members and appoints the #v three UN members with the highest combined army and naval [concept_power_projection]#!. Selected countries gain proposal and, when enabled, veto powers." # UPDATED
concept_un_member_selection_strongest_country_desc: "Adopting this reform demotes current Permanent Members and gives the only permanent seat to the country ranked #v 1st globally#!. That country becomes a Permanent Member even if it was previously outside the organization, gaining proposal and, when enabled, veto powers." # UPDATED
concept_un_decolonization_encouraged_desc: "UN members with [GetLawType('law_colonial_resettlement').GetName], [GetLawType('law_colonial_exploitation').GetName] or [GetLawType('law_frontier_colonization').GetName] are switched immediately to [GetLawType('law_no_colonial_affairs').GetName]. Members cannot enact those three colonial laws while this standard is active. Existing territories are not automatically released." # UPDATED
concept_un_decolonization_conservative_desc: "UN members with [GetLawType('law_colonial_resettlement').GetName] or [GetLawType('law_colonial_exploitation').GetName] are switched immediately to [GetLawType('law_no_colonial_affairs').GetName] and cannot enact those two laws while this standard is active. [GetLawType('law_frontier_colonization').GetName] remains permitted. Existing territories are not automatically released." # UPDATED
concept_un_decolonization_neutral_desc: "Removes the UN restrictions on Colonial Affairs laws. Members may choose their own colonial policy subject to ordinary law requirements. Former laws and colonies are not restored automatically." # UPDATED
concept_un_slavery_illegal_desc: "UN members with any slavery law are switched immediately to [GetLawType('law_slavery_banned').GetName]. Members cannot enact slavery laws while this standard is active. This directly changes domestic law even for members that opposed the resolution." # UPDATED
concept_un_slavery_neutral_desc: "Removes the UN prohibition on slavery laws. Ordinary law requirements still apply, and countries that already abolished slavery keep their current law." # UPDATED
concept_un_children_rights_negligible_desc: "Removes UN restrictions on Child Labor laws. Members keep their current laws until they change them through the normal law process." # UPDATED
concept_un_children_rights_restricted_child_labor_desc: "UN members with [GetLawType('law_child_labor_allowed').GetName] are switched immediately to [GetLawType('law_restricted_child_labor').GetName]. Members cannot return to unrestricted child labor while this standard is active. Countries with compulsory primary schooling keep their stronger standard." # UPDATED
concept_un_children_rights_compulsory_study_desc: "UN members with unrestricted or restricted child labor are switched immediately to [GetLawType('law_compulsory_primary_school').GetName]. Members cannot enact either weaker child-labor law while this standard is active." # UPDATED
concept_un_women_rights_negligible_desc: "Removes UN restrictions on Women's Rights laws. Members retain their current laws until they change them through the normal law process." # UPDATED
concept_un_women_rights_gender_equality_desc: "UN members with [GetLawType('law_no_womens_rights').GetName] or [GetLawType('law_women_own_property').GetName], including their variants, are switched immediately to [GetLawType('law_women_in_the_workplace').GetName]. Members cannot enact the weaker laws while this standard is active. Women's Suffrage remains permitted." # UPDATED
concept_un_institution_imf_not_established_desc: "This institution has not been established. A successful UN vote would unlock the following effects:\n\n$concept_un_subject_imf_desc$" # UPDATED
concept_un_institution_imf_established_desc: "$concept_un_subject_imf_desc$" # UPDATED
concept_un_institution_wto_not_established_desc: "This institution has not been established. A successful UN vote would unlock the following effects:\n\n$concept_un_subject_wto_desc$" # UPDATED
concept_un_institution_wto_established_desc: "$concept_un_subject_wto_desc$" # UPDATED
concept_un_institution_icc_not_established_desc: "This institution has not been established. A successful UN vote would unlock the following effects:\n\n$concept_un_subject_icc_desc$" # UPDATED
concept_un_institution_icc_established_desc: "$concept_un_subject_icc_desc$" # UPDATED
concept_un_institution_unesco_not_established_desc: "This institution has not been established. A successful UN vote would unlock the following effects:\n\n$concept_un_subject_unesco_desc$" # UPDATED
concept_un_institution_unesco_established_desc: "$concept_un_subject_unesco_desc$" # UPDATED
