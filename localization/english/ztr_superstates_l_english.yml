# =====================================================================================
# SUPERSTATES
# Continental unions that may form after 2030. The country definitions live in
# common/country_definitions/ztr_superstates.txt, the flags in
# common/coat_of_arms/coat_of_arms/ztr_superstates_countries.txt.
#
# Each superstate has three names: the base one below, plus a Commune and an Imperium
# variant selected by the ztr_superstate_ideology country variable.
# =====================================================================================

