l_english:
 je_demography: "Demographic Transition"
 ztr_demography_progress_bar: "Demographic Development"
 ztr_demography_notification_group: "Demographic Transition"
 notification_ztr_demography_stage_advanced_name: "Demographic Stage Advanced"
 notification_ztr_demography_stage_advanced_tooltip: "#header $notification_ztr_demography_stage_advanced_name$#!\n$notification_ztr_demography_stage_advanced_desc$"
 notification_ztr_demography_stage_regressed_name: "Demographic Stage Regressed"
 notification_ztr_demography_stage_regressed_tooltip: "#header $notification_ztr_demography_stage_regressed_name$#!\n$notification_ztr_demography_stage_regressed_desc$"
 ztr_demography_stage_flavour_0: "the #v Pre-Industrial#! stage, with #v Very High#! #positive_value Birth Rates#! and #v High#! #negative_value Death Rates#!, so its [Concept('concept_pop_growth','$concept_pop_growth$')] is #v Medium#!"
 ztr_demography_stage_flavour_1: "the #v Early Industrial#! stage, with #v Very High#! #positive_value Birth Rates#! and #v Medium#! #negative_value Death Rates#!, so its [Concept('concept_pop_growth','$concept_pop_growth$')] is #v High#!"
 ztr_demography_stage_flavour_2: "the #v Mid Industrial#! stage, with #v High#! #positive_value Birth Rates#! and #v Low#! #negative_value Death Rates#!, so its [Concept('concept_pop_growth','$concept_pop_growth$')] is #v High#!"
 ztr_demography_stage_flavour_3: "the #v Late Industrial#! stage, with #v Medium#! #positive_value Birth Rates#! and #v Very Low#! #negative_value Death Rates#!, so its [Concept('concept_pop_growth','$concept_pop_growth$')] is #v Medium#!"
 ztr_demography_stage_flavour_4: "the #v Early Post-Industrial#! stage, with #v Low#! #positive_value Birth Rates#! and #v Very Low#! #negative_value Death Rates#!, so its [Concept('concept_pop_growth','$concept_pop_growth$')] is #v Low#!"
 ztr_demography_stage_flavour_5: "the #v Mid Post-Industrial#! stage, with #v Low#! #positive_value Birth Rates#! and #v Very Low#! #negative_value Death Rates#!, so its [Concept('concept_pop_growth','$concept_pop_growth$')] is #v Low#!"
 ztr_demography_stage_flavour_6: "the #v Late Post-Industrial#! stage, with #v Minimal#! #positive_value Birth Rates#! and #v Minimal#! #negative_value Death Rates#!, so its [Concept('concept_pop_growth','$concept_pop_growth$')] is #v Minimal#!"
 ztr_demography_stage_flavour_7: "the #v Stagnant#! stage, with #v Non-Existent#! #positive_value Birth Rates#! and #v Minimal#! #negative_value Death Rates#!, so its [Concept('concept_pop_growth','$concept_pop_growth$')] is #v Stagnant#!"
 ztr_demography_stage_flavour_8: "the #v Declining#! stage, with #v Non-Existent#! #positive_value Birth Rates#! and #v Rising#! #negative_value Death Rates#!, so its [Concept('concept_pop_growth','$concept_pop_growth$')] is #v Negative#!"
 ztr_demography_stage_flavour_unknown: "a stage whose birth and death rates are still being surveyed"
 je_demography_reason: "[ROOT.GetCountry.GetName] is in stage #v [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_applied_stage')|0]#! of 8 of the [Concept('concept_demographic_stages','$concept_demographic_stages$')]: [SCOPE.GetRootScope.GetCountry.GetCustom('ztr_demography_stage_flavour')].\n\nProgress runs from 0 to 900: every 100 points marks a stage, and stage 8 extends to 900. It moves in both directions, so crossing a threshold can advance our stage or push it back.\n\n[Concept('concept_literacy','$concept_literacy$')] scales the whole transition, while the five-year change in [Concept('concept_sol','$concept_sol$')] and GDP per capita sets its direction: growth accelerates the early stages and holds back the late decline, stagnation slows the early stages and deepens the late ones.\n\nHealthcare speeds the transition up. Traditional values, legal slavery and open immigration slow it down." # UPDATED
 je_demography_collecting_history: "Moving #variable [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_recorded_yearly_change')|+=1]#! points a year.\nThe economic response begins after five years of recorded history." # UPDATED
 je_demography_status: "Moving #variable [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_recorded_yearly_change')|+=1]#! points a year.\n#variable [ROOT.GetCountry.MakeScope.Var('ztr_demography_formula_change_var').GetValue|+=1]#! from Society, #variable [ROOT.GetCountry.MakeScope.Var('ztr_demography_extra_change_var').GetValue|+=1]#! from Culture/Laws." # UPDATED
 ztr_demography_progress_bar_desc: "Stage #v [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_applied_stage')|0]#!: [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/900" # UPDATED
 notification_ztr_demography_stage_advanced_desc: "Our demographic transition has reached stage #v [GetPlayer.MakeScope.ScriptValue('ztr_demography_applied_stage')|0]#!. Birth and death rates shift accordingly." # UPDATED
 notification_ztr_demography_stage_regressed_desc: "Our demographic transition has fallen back to stage #v [GetPlayer.MakeScope.ScriptValue('ztr_demography_applied_stage')|0]#!. Stagnating living standards and income have reversed part of our progress." # UPDATED
